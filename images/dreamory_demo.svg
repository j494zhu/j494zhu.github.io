<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8aa0"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="url(#bg)"/>

  <text x="60" y="78" font-family="Georgia, serif" font-size="34" fill="#22303f">Dreamory</text>
  <text x="60" y="106" font-size="15" fill="#7a8aa0" letter-spacing="1">HIERARCHICAL MEMORY &#183; EMOTION ENGINE &#183; AGENTIC TOOLS</text>

  <!-- L1 -->
  <rect x="60" y="150" width="330" height="64" rx="6" fill="#ffffff" stroke="#0056b3" stroke-width="1.5"/>
  <text x="82" y="177" font-size="14" font-weight="bold" fill="#0056b3">L1 &#183; Context Window</text>
  <text x="82" y="197" font-size="12.5" fill="#666">emotional state + personality slots</text>

  <!-- L2 -->
  <rect x="60" y="238" width="330" height="64" rx="6" fill="#ffffff" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="82" y="265" font-size="14" font-weight="bold" fill="#4a7fb5">L2 &#183; Hot Zone</text>
  <text x="82" y="285" font-size="12.5" fill="#666">in-memory, time-decay recall</text>

  <!-- L3 -->
  <rect x="60" y="326" width="330" height="64" rx="6" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.5"/>
  <text x="82" y="353" font-size="14" font-weight="bold" fill="#6d89a8">L3 &#183; Cold Storage</text>
  <text x="82" y="373" font-size="12.5" fill="#666">PostgreSQL + pgvector, dual-axis retrieval</text>

  <!-- flows between tiers -->
  <line x1="225" y1="214" x2="225" y2="238" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="302" x2="255" y2="326" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="195" y1="238" x2="195" y2="214" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="326" x2="285" y2="302" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- emotion engine panel -->
  <rect x="470" y="150" width="270" height="108" rx="6" fill="#ffffff" stroke="#d5806b" stroke-width="1.5"/>
  <text x="492" y="179" font-size="14" font-weight="bold" fill="#c05f47">Emotion Engine</text>
  <text x="492" y="200" font-size="12.5" fill="#666">3 hormone axes, distinct half-lives</text>
  <text x="492" y="219" font-size="12.5" fill="#666">attachment-theory affection model</text>
  <text x="492" y="238" font-size="12.5" fill="#666">no LLM in the hot path</text>

  <!-- agents panel -->
  <rect x="470" y="282" width="270" height="108" rx="6" fill="#ffffff" stroke="#6b9e7e" stroke-width="1.5"/>
  <text x="492" y="311" font-size="14" font-weight="bold" fill="#4c8563">Agentic Layer</text>
  <text x="492" y="332" font-size="12.5" fill="#666">bounded tool loop: search / grep / timers</text>
  <text x="492" y="351" font-size="12.5" fill="#666">offline &#8220;dream&#8221; consolidation</text>
  <text x="492" y="370" font-size="12.5" fill="#666">nightly distillation agent</text>

  <!-- cross links -->
  <line x1="390" y1="204" x2="470" y2="204" stroke="#7a8aa0" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="470" y1="336" x2="390" y2="336" stroke="#7a8aa0" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
